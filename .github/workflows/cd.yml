name: CD — Update Deployment Tag (ArgoCD GitOps)

on:
  push:
    branches: ["main", "ST/flask-react-cicd"]
    paths:
      - 'api/**'
      - 'Dockerfile'

jobs:
  update-manifest:
    name: Update deployment.yaml with new image tag
    runs-on: ubuntu-latest
    # Only run if CI actually passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write  # needed to push the updated deployment.yaml

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use a PAT so the push triggers ArgoCD's webhook (GITHUB_TOKEN pushes are ignored by default)
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      # Reconstruct the SHA from the triggering workflow run
      - name: Get image SHA tag from triggering workflow
        id: get_sha
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "🔖 New image tag: ${SHORT_SHA}"

      # Patch deployment.yaml: replace whatever SHA was there with the new one.
      # ArgoCD watches this file — any git change here triggers an automatic sync.
      - name: Patch image tag in deployment.yaml
        run: |
          SHORT_SHA="${{ steps.get_sha.outputs.short_sha }}"
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/car-sensor-api"

          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${SHORT_SHA}|" deployments/deployment.yaml

          echo "📄 Updated deployment.yaml:"
          grep "image:" deployments/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          SHORT_SHA="${{ steps.get_sha.outputs.short_sha }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deployments/deployment.yaml

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "⏭️  deployment.yaml already up to date, skipping commit"
          else
            git commit -m "chore: bump image to ${SHORT_SHA} [skip ci]"
            git push
            echo "✅ Pushed updated deployment.yaml — ArgoCD will sync shortly"
          fi
