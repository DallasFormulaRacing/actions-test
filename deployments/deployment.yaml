apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-sensor-api
  labels:
    app: car-sensor-api
spec:

  #EDIT THIS TO 0 IF YOU WANT TO STOP APPLICATION
  #OTHERWISE, SET IT TO 1-5 TO RUN APPLICATION
  replicas: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: car-sensor-api
  template:
    metadata:
      labels:
        app: car-sensor-api
    spec:
      containers:
        - name: car-sensor-api
          # This tag is auto-updated by the CD workflow on every push to main
          image: dallasformularacing/car-sensor-api:6b9daea
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http

          # ── Environment variables (pulled from K8s Secrets) ──────────────────
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: car-sensor-secrets
                  key: DATABASE_URL
            - name: EVENTHUB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: car-sensor-secrets
                  key: EVENTHUB_CONNECTION_STRING
            - name: EVENTHUB_CONSUMER_STRING
              valueFrom:
                secretKeyRef:
                  name: car-sensor-secrets
                  key: EVENTHUB_CONSUMER_STRING
            - name: EVENTHUB_NAME
              valueFrom:
                secretKeyRef:
                  name: car-sensor-secrets
                  key: EVENTHUB_NAME
            - name: FLASK_ENV
              value: "production"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: car-sensor-secrets
                  key: SENTRY_DSN

          # ── Resource limits (prevents one pod from eating the whole node) ────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Health checks ────────────────────────────────────────────────────
          # Liveness: if this fails, k8s restarts the pod
          livenessProbe:
            httpGet:
              path: /sensors
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # Readiness: pod won't receive traffic until this passes
          readinessProbe:
            httpGet:
              path: /sensors
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
