apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-react-app
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: flask-react-app
  template:
    metadata:
      labels:
        app: flask-react-app
    spec:
      containers:
      - name: flask-react-app
        image: dallasformularacing/actions-test_flask-react:PLACEHOLDER
        ports:
        - containerPort: 5000
